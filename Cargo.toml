[package]
name = "qmp-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "^1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
serde = { version = "^1", features = ["derive"]}
serde_json = "^1"
bytes = "^1"
clap = { version = "^4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "^2"
